name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app_test
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11 (lockfile is npm 11)
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - run: npm run build:worker
      - name: Smoke test — /api/health against Postgres
        run: |
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
          PORT=3100 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/health; then exit 0; fi
            sleep 1
          done
          echo "health check failed"; exit 1
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright, mobile + desktop)
        run: npm run e2e
        env:
          E2E_DATABASE_URL: postgres://app:app@localhost:5432/likina_e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
