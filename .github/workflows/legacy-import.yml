name: Legacy import (catalogue → Neon)

# Imports the old likina.com catalogue (data/legacy/catalog.json + the original
# images from the cPanel backup, stored as the release asset "legacy-uploads")
# into the production database. Idempotent: running it again changes nothing.
# Run manually: Actions → Legacy import → Run workflow.
on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Overwrite artworks that were already imported (loses admin edits)"
        type: boolean
        default: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download the original images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download legacy-uploads --pattern uploads.tar --dir /tmp
          mkdir -p /tmp/uploads && tar -xf /tmp/uploads.tar -C /tmp/uploads
      - name: Import
        env:
          DATABASE_URL: ${{ secrets.IMPORT_DATABASE_URL }}
        run: |
          npx tsx scripts/import-legacy.ts \
            --uploads /tmp/uploads/public_html/wp-content/uploads \
            --report import-report.md \
            ${{ inputs.overwrite && '--overwrite' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: likina-import-report
          path: import-report.md
          retention-days: 90
