# Local development: only Postgres. Run the app with `npm run dev`
# and the worker with `npm run worker:dev`.
#   docker compose -f compose.dev.yaml up -d

name: lejish-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata-dev:
